services:
  traefik:
    image: traefik:v3.1
    profiles: [core, data, ai]
    networks: [oe]
    command: ["--configFile=/etc/traefik/traefik.yml"]
    volumes:
      - ../../traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ../../traefik/dynamic:/etc/traefik/dynamic:ro
    ports:
      - "${OE_TRAEFIK_PORT:-8080}:8080"
      - "${OE_TRAEFIK_DASHBOARD_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 128m
