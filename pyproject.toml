[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-emarsys"
version = "0.1.0"

[tool.uv]
# Python workspace for ML and GenAI services
# Uncomment members as services are scaffolded in F0.4+
# members = ["services/ml", "services/genai"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
