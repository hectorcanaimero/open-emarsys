services:
  # Applies core's Prisma migrations before core starts: nothing else does, and without
  # them `make seed` finds no identity tables. Same image as core (built once, cached).
  core-migrate:
    image: open-emarsys-core:dev
    build:
      context: ../../..
      dockerfile: services/core/Dockerfile
    profiles: [core]
    networks: [oe]
    command: ["node_modules/.bin/prisma", "migrate", "deploy", "--schema", "prisma/schema"]
    environment:
      DATABASE_URL: postgres://core:${OE_PG_CORE_PASSWORD}@${OE_PG_HOST:-postgres}:${OE_PG_HOST_PORT:-5432}/${OE_PG_DB}
    depends_on:
      postgres:
        condition: service_healthy
        required: false # absent when Postgres is external (no `localdb` profile)

  core:
    image: open-emarsys-core:dev
    build:
      context: ../../..
      dockerfile: services/core/Dockerfile
    profiles: [core]
    networks: [oe]
    ports:
      - "${OE_CORE_PORT:-3001}:3000"
    environment:
      NODE_ENV: production
      # OE_PG_HOST/OE_PG_HOST_PORT point at an external Postgres; connection_limit keeps a
      # shared server's max_connections in reach (Prisma defaults to 2 x CPUs + 1).
      DATABASE_URL: postgres://core:${OE_PG_CORE_PASSWORD}@${OE_PG_HOST:-postgres}:${OE_PG_HOST_PORT:-5432}/${OE_PG_DB}?connection_limit=${OE_PG_POOL:-5}
      NATS_URL: nats://nats:4222
      CORE_JWT_ISSUER: ${CORE_JWT_ISSUER:-open-emarsys/core}
      # The host paths in .env are bind-mounted below; core reads the container paths.
      CORE_JWT_KEYS_DIR: /run/secrets/jwt
      CORE_ENCRYPTION_KEY: ${CORE_ENCRYPTION_KEY:?set CORE_ENCRYPTION_KEY in .env}
      CORE_SERVICE_CREDENTIALS: /run/secrets/service-credentials.json
      SMTP_URL: smtp://mailpit:1025
      # GDPR exports (F1): the `exports` bucket that minio-init creates.
      CORE_MINIO_ENDPOINT: http://minio:9000
      CORE_MINIO_PUBLIC_ENDPOINT: http://localhost:${MINIO_API_PORT:-9000}
      CORE_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      CORE_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      # startOtel() exports over OTLP; the SDK default (localhost:4318) is nothing inside the container.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    volumes:
      - ${CORE_JWT_KEYS_DIR:?set CORE_JWT_KEYS_DIR in .env}:/run/secrets/jwt:ro
      - ${CORE_SERVICE_CREDENTIALS:?set CORE_SERVICE_CREDENTIALS in .env}:/run/secrets/service-credentials.json:ro
    depends_on:
      core-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
        required: false
      nats:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/readyz"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512m
