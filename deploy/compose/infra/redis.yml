services:
  redis:
    image: redis:7-alpine
    profiles: [localdb]
    networks: [oe]
    # appendonly no: datos efímeros y reconstruibles (Data model → Redis).
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "${OE_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 128m
