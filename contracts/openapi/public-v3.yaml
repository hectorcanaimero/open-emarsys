openapi: 3.1.0
info:
  title: open-emarsys public API
  version: 3.0.0
  summary: Public, Emarsys-compatible API (contract C2).
  description: |
    Every response except the OAuth token endpoint is wrapped in an `Envelope`:
    `{ "replyCode": 0, "replyText": "OK", "data": {...} }`.

    - `replyCode` is `0` on success and non-zero on business errors (returned with HTTP 4xx).
    - Per-item errors in batch operations are reported inside `data.errors[]` (`BatchErrors`),
      alongside the items that succeeded.
    - Long-running operations return `202` with `data: { job_id }` (`JobAccepted`); poll
      `GET /jobs/{id}` until `status` is terminal.

    Authentication is OAuth 2.0 client credentials: exchange a client id and secret created in
    the console (`/admin/v1/api-clients`) for a 1-hour JWT bearer token at `POST /oauth/token`.
    The token carries the scopes granted to the client (`module:action`); requests outside them
    get `403`. `POST /oauth/token` follows RFC 6749 wire format (form body, `{error}` errors)
    so standard OAuth libraries work unchanged.

    Paths are added per phase; each phase has its own tag below. F1+ tasks add their paths
    under the matching tag and their scopes to `components.securitySchemes.oauth2`.

    Contacts are addressed by field IDs, never by names: `key_id` is the ID (as a string) of a
    unique field (`3` email, `4` external_id, `id` for the internal contact id, or a custom field
    marked unique) and contact payloads are maps `{"<fieldId>": value}`. System field IDs are
    listed in `contracts/dsl/system-fields.json`; custom fields start at `1000`.

    Business `replyCode`s (also used as `code` in `data.errors[]`):

    | Code | HTTP | Meaning |
    |------|------|---------|
    | 0    | 200/202 | OK (batch operations may still list failed items in `data.errors`) |
    | 1001 | 400 | Malformed request: missing or invalid parameter or body |
    | 1002 | 400 | Batch too large (more than 1,000 items) |
    | 2008 | 404 / item | Contact not found for the given key |
    | 2009 | 400 | Invalid `key_id`: the field does not exist or is not unique |
    | 2010 | 400 / item | Invalid value for the field's type (date, number, choice id, ...) |
    | 2011 | 400 / item | Field does not exist |
    | 2012 | item | Contact already exists (`POST /contact` with an existing key) |
    | 2013 | item | Field is read-only (e.g. `40` created_at) |
    | 2014 | 400 / item | Key value missing or duplicated within the same request |
    | 2015 | 409 | Field name already in use |
    | 2016 | 404 | Contact list not found |
    | 2017 | 404 | Relational table not found |
    | 2018 | 400 | Invalid import mapping, mode or target |
servers:
  - url: /api/v3
security:
  - oauth2: []
tags:
  - name: F0 Platform
    description: OAuth token and job polling (core, importer).
  - name: F1 Contacts
    description: Fields, contacts, contact lists, consent, GDPR, import/export.
  - name: F2 Behavior
    description: External events, event triggers, orders.
  - name: F3 Segments
    description: Filters, counts and members.
  - name: F4 Email
    description: Email campaigns, launch, test sends, response summary, transactional email.
  - name: F5 Automation
    description: Programs and manual enrollment.
  - name: F6 Catalog
    description: Product catalog and recommendations.
  - name: F7 Mobile
    description: Devices, inbox, SMS and push.
  - name: F8 Analytics
    description: Campaign analytics and open data exports.
  - name: F9 Loyalty
    description: Loyalty balances and redemptions.
  - name: F10 Integrations
    description: Webhooks.
paths:
  /oauth/token:
    post:
      tags: [F0 Platform]
      operationId: createToken
      summary: Exchange client credentials for an access token
      description: |
        Client credentials may be sent in the form body or via HTTP Basic
        (`Authorization: Basic base64(client_id:client_secret)`). A revoked client gets
        `401 invalid_client`. Requesting a scope the client was not granted returns
        `400 invalid_scope`; omitting `scope` grants every scope of the client.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: Token issued.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Malformed request, unsupported grant type or invalid scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '401':
          description: Unknown client, wrong secret or revoked client.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /jobs/{id}:
    get:
      tags: [F0 Platform]
      operationId: getJob
      summary: Get the status of a long-running job
      security:
        - oauth2: ['jobs:view']
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Current job state.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /field:
    get:
      tags: [F1 Contacts]
      operationId: listFields
      summary: List system and custom fields
      security:
        - oauth2: ['contacts:view']
      responses:
        '200':
          description: Every non-deleted field of the tenant.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Field'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [F1 Contacts]
      operationId: createField
      summary: Create a custom field
      description: |
        Assigns the next custom field ID (≥ 1000), which never changes afterwards. A name
        already in use returns `409` with `replyCode` 2015.
      security:
        - oauth2: ['contacts:admin']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FieldCreate'
      responses:
        '200':
          description: Field created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Field'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /field/{id}/choice:
    get:
      tags: [F1 Contacts]
      operationId: listFieldChoices
      summary: List the options of a single or multi choice field
      security:
        - oauth2: ['contacts:view']
      parameters:
        - $ref: '#/components/parameters/FieldId'
      responses:
        '200':
          description: Options with their stable IDs; `choice` is the label in the tenant's locale.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/FieldChoice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /contact:
    post:
      tags: [F1 Contacts]
      operationId: createContacts
      summary: Create up to 1,000 contacts
      description: |
        Partial success (FR-8): valid contacts are created and every failing one is reported in
        `data.errors` with its index (2012 when the key already exists, 2010/2011/2013/2014 for
        invalid data). `data.ids` holds the created contact IDs in request order, skipping
        failed items.
      security:
        - oauth2: ['contacts:edit']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactBatchRequest'
      responses:
        '200':
          $ref: '#/components/responses/ContactBatch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      tags: [F1 Contacts]
      operationId: updateContacts
      summary: Update up to 1,000 contacts, optionally creating missing ones
      description: |
        Contacts are matched by `key_id`. Only the fields sent are changed; `null` clears a
        field. Without `create_if_not_exists=1` an unknown key is reported as 2008 in
        `data.errors`; with it the contact is created (upsert). Partial success as in
        `POST /contact`.
      security:
        - oauth2: ['contacts:edit']
      parameters:
        - name: create_if_not_exists
          in: query
          required: false
          schema: { type: integer, enum: [0, 1], default: 0 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactBatchRequest'
      responses:
        '200':
          $ref: '#/components/responses/ContactBatch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /contact/delete:
    post:
      tags: [F1 Contacts]
      operationId: deleteContacts
      summary: Delete up to 1,000 contacts by key
      description: Each item carries only the key field. Unknown keys are reported as 2008.
      security:
        - oauth2: ['contacts:edit']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactBatchRequest'
            example:
              key_id: '3'
              contacts:
                - '3': ana@example.com
      responses:
        '200':
          $ref: '#/components/responses/ContactBatch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /contact/getdata:
    post:
      tags: [F1 Contacts]
      operationId: getContactData
      summary: Read selected fields of up to 1,000 contacts
      description: |
        Returns only the requested field IDs for each contact found (FR-9). Keys with no
        contact are listed in `data.errors` with 2008; unknown field IDs fail the whole request
        with 2011.
      security:
        - oauth2: ['contacts:view']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetDataRequest'
      responses:
        '200':
          description: Contacts found and per-key errors.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/GetDataResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /contact/consent:
    post:
      tags: [F1 Contacts]
      operationId: setContactConsent
      summary: Record a consent change for one contact and channel
      description: |
        Appends to the contact's consent history and updates the channel's opt-in field
        (`31` email, `32` sms, `33` push). Unknown contact returns `404` with 2008.
      security:
        - oauth2: ['contacts:edit']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentRequest'
      responses:
        '200':
          description: Consent recorded.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ContactRef'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /contactlist:
    get:
      tags: [F1 Contacts]
      operationId: listContactLists
      summary: List contact lists
      security:
        - oauth2: ['contacts:view']
      responses:
        '200':
          description: Every contact list of the tenant.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ContactList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [F1 Contacts]
      operationId: createContactList
      summary: Create a contact list, optionally with initial members
      security:
        - oauth2: ['contacts:edit']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactListCreate'
      responses:
        '200':
          description: List created; keys that matched no contact are listed in `errors`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [id, errors]
                        properties:
                          id:
                            type: string
                            format: uuid
                          errors:
                            type: array
                            items:
                              $ref: '#/components/schemas/BatchError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /contactlist/{id}/add:
    post:
      tags: [F1 Contacts]
      operationId: addContactListMembers
      summary: Add up to 1,000 contacts to a list by key
      description: Adding a contact already in the list is not an error. Unknown keys are reported as 2008.
      security:
        - oauth2: ['contacts:edit']
      parameters:
        - $ref: '#/components/parameters/ListId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListMembersRequest'
      responses:
        '200':
          $ref: '#/components/responses/ListMembers'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /contactlist/{id}/delete:
    post:
      tags: [F1 Contacts]
      operationId: removeContactListMembers
      summary: Remove up to 1,000 contacts from a list by key
      description: The contacts themselves are not deleted. Unknown keys are reported as 2008.
      security:
        - oauth2: ['contacts:edit']
      parameters:
        - $ref: '#/components/parameters/ListId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListMembersRequest'
      responses:
        '200':
          $ref: '#/components/responses/ListMembers'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /contactlist/{id}/count:
    get:
      tags: [F1 Contacts]
      operationId: countContactListMembers
      summary: Count the members of a list
      security:
        - oauth2: ['contacts:view']
      parameters:
        - $ref: '#/components/parameters/ListId'
      responses:
        '200':
          description: Number of (non-deleted) contacts in the list.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [count]
                        properties:
                          count:
                            type: integer
                            minimum: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /gdpr/export:
    post:
      tags: [F1 Contacts]
      operationId: gdprExport
      summary: Export every piece of data held about one contact
      description: |
        Starts a job whose `result_url` points to a file with the contact's fields, list
        memberships, consent history and relational rows. Unknown contact returns 2008.
      security:
        - oauth2: ['contacts:admin']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactKey'
      responses:
        '202':
          $ref: '#/components/responses/JobAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /gdpr/forget:
    post:
      tags: [F1 Contacts]
      operationId: gdprForget
      summary: Erase one contact (right to be forgotten)
      description: |
        Starts a job that deletes the contact's personal data everywhere (fields, list
        memberships, relational rows, analytics); irreversible. Unknown contact returns 2008.
      security:
        - oauth2: ['contacts:admin']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactKey'
      responses:
        '202':
          $ref: '#/components/responses/JobAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /import:
    post:
      tags: [F1 Contacts]
      operationId: createImport
      summary: Import a CSV file of contacts, list members or relational rows
      description: |
        Starts an import job. Rows that fail are skipped and listed in the job's
        `error_report_url`; the rest are applied.
      security:
        - oauth2: ['contacts:edit']
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImportRequest'
            encoding:
              mapping:
                contentType: application/json
      responses:
        '202':
          $ref: '#/components/responses/JobAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /export:
    post:
      tags: [F1 Contacts]
      operationId: createExport
      summary: Export contacts to CSV
      description: Starts an export job; download the file from the job's `result_url`.
      security:
        - oauth2: ['contacts:view']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportRequest'
      responses:
        '202':
          $ref: '#/components/responses/JobAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /relational/{tableId}/rows:
    put:
      tags: [F1 Contacts]
      operationId: upsertRelationalRows
      summary: Upsert up to 1,000 rows of a relational table
      description: |
        Each row belongs to the contact found by `key_id`/`key_value` and is identified within
        that contact by `row_key`; an existing row is replaced. Unknown contacts are reported as
        2008, invalid values as 2010/2011.
      security:
        - oauth2: ['contacts:edit']
      parameters:
        - name: tableId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelationalRowsRequest'
      responses:
        '200':
          description: Rows applied and per-row errors.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [upserted, errors]
                        properties:
                          upserted:
                            type: integer
                            minimum: 0
                          errors:
                            type: array
                            items:
                              $ref: '#/components/schemas/BatchError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
components:
  parameters:
    FieldId:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    ListId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  securitySchemes:
    oauth2:
      type: oauth2
      description: OAuth 2.0 client credentials; bearer JWT (RS256) valid for 1 hour.
      flows:
        clientCredentials:
          tokenUrl: /api/v3/oauth/token
          scopes:
            jobs:view: Read the status of jobs started by this tenant.
            contacts:view: Read fields, contacts and lists; export contacts.
            contacts:edit: Create, update and delete contacts, lists, consent and relational rows; import.
            contacts:admin: Create custom fields; GDPR export and erasure.
  schemas:
    FieldIdKey:
      type: string
      pattern: '^[0-9]+$'
      description: A field ID as a string, e.g. `"3"` for email.
    KeyId:
      type: string
      pattern: '^([0-9]+|id)$'
      description: |
        Field ID of a unique field used to match contacts (`3` email, `4` external_id, a unique
        custom field) or `id` for the internal contact id. Anything else fails with 2009.
      examples: ['3']
    FieldType:
      type: string
      enum: [text, number, date, boolean, single_choice, multi_choice]
    FieldValue:
      description: |
        Value of one field: text as string, number as number, date as `YYYY-MM-DD`, boolean,
        single choice as the option ID, multi choice as an array of option IDs, `null` to clear.
      type: [string, number, boolean, array, 'null']
      items:
        type: integer
    ContactData:
      type: object
      description: Map of field ID to value.
      propertyNames:
        $ref: '#/components/schemas/FieldIdKey'
      additionalProperties:
        $ref: '#/components/schemas/FieldValue'
      examples:
        - '3': ana@example.com
          '1': Ana
    Field:
      type: object
      required: [id, name, application_type, string_id]
      properties:
        id:
          type: integer
          description: Stable field ID; 1–99 system, ≥ 1000 custom.
        name:
          type: string
          description: Label in the tenant's locale.
        application_type:
          $ref: '#/components/schemas/FieldType'
        string_id:
          type: string
          description: Unique snake_case `api_name`.
          examples: [first_name]
    FieldCreate:
      type: object
      required: [name, application_type]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        application_type:
          $ref: '#/components/schemas/FieldType'
        string_id:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
          description: Defaults to the snake_case form of `name`.
        unique:
          type: boolean
          default: false
          description: Unique fields can be used as `key_id`.
        choices:
          type: array
          description: Options, in order; required for choice types.
          items:
            type: string
            minLength: 1
    FieldChoice:
      type: object
      required: [id, choice]
      properties:
        id:
          type: integer
        choice:
          type: string
    ContactBatchRequest:
      type: object
      required: [key_id, contacts]
      properties:
        key_id:
          $ref: '#/components/schemas/KeyId'
        contacts:
          type: array
          minItems: 1
          maxItems: 1000
          description: Each contact must include the `key_id` field.
          items:
            $ref: '#/components/schemas/ContactData'
      examples:
        - key_id: '3'
          contacts:
            - '3': ana@example.com
              '1': Ana
    ContactRef:
      type: object
      required: [id]
      properties:
        id:
          type: string
          description: Internal contact id.
    GetDataRequest:
      type: object
      required: [keyId, keyValues, fields]
      properties:
        keyId:
          $ref: '#/components/schemas/KeyId'
        keyValues:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: string
        fields:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/FieldIdKey'
      examples:
        - keyId: '3'
          keyValues: [ana@example.com]
          fields: ['1', '2']
    GetDataResult:
      type: object
      required: [result, errors]
      properties:
        result:
          type: array
          items:
            type: object
            required: [id]
            description: '`id` plus one entry per requested field ID.'
            properties:
              id:
                type: string
            additionalProperties:
              $ref: '#/components/schemas/FieldValue'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/BatchError'
      examples:
        - result:
            - id: '1'
              '1': Ana
              '2': null
          errors:
            - index: 1
              key: nobody@example.com
              code: 2008
              text: Contact not found
    ContactKey:
      type: object
      required: [key_id, key_value]
      properties:
        key_id:
          $ref: '#/components/schemas/KeyId'
        key_value:
          type: string
    ConsentRequest:
      allOf:
        - $ref: '#/components/schemas/ContactKey'
        - type: object
          required: [channel, value, source]
          properties:
            channel:
              type: string
              enum: [email, sms, push]
            value:
              type: [integer, 'null']
              enum: [1, 2, null]
              description: '`1` opted in, `2` opted out, `null` unknown.'
            source:
              type: string
              description: Where the consent was collected (form, import, API client...).
              examples: [signup_form]
            text:
              type: string
              description: Consent wording shown to the contact.
    ContactList:
      type: object
      required: [id, name, created]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        created:
          type: string
          format: date-time
    ContactListCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        key_id:
          $ref: '#/components/schemas/KeyId'
        external_ids:
          type: array
          maxItems: 1000
          description: Key values (of `key_id`) of the initial members.
          items:
            type: string
    ListMembersRequest:
      type: object
      required: [key_id, external_ids]
      properties:
        key_id:
          $ref: '#/components/schemas/KeyId'
        external_ids:
          type: array
          minItems: 1
          maxItems: 1000
          description: Key values of the contacts to add or remove.
          items:
            type: string
    ImportRequest:
      type: object
      required: [file, mapping, key_id, mode, target]
      properties:
        file:
          type: string
          contentMediaType: text/csv
          description: CSV with a header row.
        mapping:
          type: object
          description: CSV column name → field ID.
          additionalProperties:
            $ref: '#/components/schemas/FieldIdKey'
          examples:
            - Email: '3'
              Nombre: '1'
        key_id:
          $ref: '#/components/schemas/KeyId'
        mode:
          type: string
          enum: [create, update, upsert]
        target:
          type: string
          pattern: '^(contacts|list:[0-9a-fA-F-]{36}|relational:[0-9a-fA-F-]{36})$'
          description: '`contacts`, `list:<listId>` (upsert and add to the list) or `relational:<tableId>`.'
    ExportRequest:
      type: object
      required: [fields, scope, format]
      properties:
        fields:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/FieldIdKey'
        scope:
          type: string
          pattern: '^(all|list:[0-9a-fA-F-]{36})$'
          description: '`all` or `list:<listId>`.'
        format:
          type: string
          const: csv
    RelationalRowsRequest:
      type: object
      required: [key_id, rows]
      properties:
        key_id:
          $ref: '#/components/schemas/KeyId'
        rows:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: object
            required: [key_value, row_key, data]
            properties:
              key_value:
                type: string
              row_key:
                type: string
                description: Row identifier, unique per contact within the table.
              data:
                type: object
                description: Column name → value, validated against the table's columns.
                additionalProperties: true
    Envelope:
      type: object
      description: Wrapper of every public API response.
      required: [replyCode, replyText, data]
      properties:
        replyCode:
          type: integer
          description: 0 on success; non-zero business error code otherwise.
          examples: [0]
        replyText:
          type: string
          examples: [OK]
        data:
          description: Operation payload; `{}` or `null` when there is nothing to return.
    ErrorEnvelope:
      description: Envelope returned with HTTP 4xx.
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            replyCode:
              type: integer
              not: { const: 0 }
            data:
              type: [object, 'null']
      examples:
        - replyCode: 2009
          replyText: Invalid key_id
          data: null
    BatchError:
      type: object
      required: [index, code, text]
      properties:
        index:
          type: integer
          minimum: 0
          description: Position of the failing item in the request array.
        key:
          type: [string, 'null']
          description: Value of the item's key field, when present.
        code:
          type: integer
          description: Business error code (same space as `replyCode`).
        text:
          type: string
    BatchErrors:
      description: Envelope of a batch operation; failed items are listed in `data.errors`.
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              required: [errors]
              properties:
                errors:
                  type: array
                  items:
                    $ref: '#/components/schemas/BatchError'
      examples:
        - replyCode: 0
          replyText: OK
          data:
            ids: ['1', '2']
            errors:
              - index: 2
                key: john@example.com
                code: 2012
                text: Contact already exists
    JobAccepted:
      type: object
      description: '`data` of a `202` response for a long-running operation.'
      required: [job_id]
      properties:
        job_id:
          type: string
          format: uuid
    Job:
      type: object
      required: [id, kind, status, progress, result_url, error_report_url]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          description: Operation that started the job.
          examples: [contact_import, contact_export, gdpr_export]
        status:
          type: string
          enum: [queued, running, succeeded, failed, cancelled]
        progress:
          type: number
          minimum: 0
          maximum: 100
          description: Completion percentage.
        result_url:
          type: [string, 'null']
          format: uri
          description: Pre-signed download URL of the result, once `succeeded`.
        error_report_url:
          type: [string, 'null']
          format: uri
          description: Pre-signed download URL of the per-row error report, if any rows failed.
    TokenRequest:
      type: object
      required: [grant_type]
      properties:
        grant_type:
          type: string
          const: client_credentials
        client_id:
          type: string
        client_secret:
          type: string
          format: password
        scope:
          type: string
          description: Space-separated subset of the client's scopes.
          examples: ['contacts:view contacts:edit']
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in, scope]
      properties:
        access_token:
          type: string
          description: RS256 JWT with `typ=client`; see `JwtClaims` in admin-v1/identity.yaml.
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          const: 3600
        scope:
          type: string
          description: Space-separated scopes granted.
    OAuthError:
      type: object
      description: RFC 6749 §5.2 error.
      required: [error]
      properties:
        error:
          type: string
          enum: [invalid_request, invalid_client, invalid_grant, unauthorized_client, unsupported_grant_type, invalid_scope]
        error_description:
          type: string
  responses:
    ContactBatch:
      description: Contacts processed; failed items are listed in `data.errors`.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/BatchErrors'
              - type: object
                properties:
                  data:
                    type: object
                    required: [ids]
                    properties:
                      ids:
                        type: array
                        description: IDs of the contacts processed successfully, in request order.
                        items:
                          type: string
    ListMembers:
      description: Membership changed; keys that matched no contact are listed in `data.errors`.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/BatchErrors'
              - type: object
                properties:
                  data:
                    type: object
                    required: [count]
                    properties:
                      count:
                        type: integer
                        minimum: 0
                        description: Contacts added or removed.
    JobAccepted:
      description: Job queued; poll `GET /jobs/{id}`.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/JobAccepted'
    Conflict:
      description: The resource conflicts with an existing one.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    BadRequest:
      description: Invalid parameters or business rule violation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Missing, expired or invalid bearer token, or the client was revoked.
      headers:
        WWW-Authenticate:
          schema: { type: string, examples: ['Bearer error="invalid_token"'] }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: The token lacks the scope required by the operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource does not exist in the caller's tenant.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema: { type: integer }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
