services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    profiles: [obs]
    networks: [oe]
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ../../observability/otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "${OE_OTEL_GRPC_PORT:-4317}:4317"
      - "${OE_OTEL_HTTP_PORT:-4318}:4318"
    depends_on:
      tempo:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:13133/"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256m

  tempo:
    image: grafana/tempo:2.6.0
    profiles: [obs]
    networks: [oe]
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ../../observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3200/ready"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256m

  loki:
    image: grafana/loki:3.1.0
    profiles: [obs]
    networks: [oe]
    ports:
      - "${OE_LOKI_PORT:-3100}:3100"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256m

  prometheus:
    image: prom/prometheus:v2.55.0
    profiles: [obs]
    networks: [oe]
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ../../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${OE_PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256m

  grafana:
    image: grafana/grafana:11.2.0
    profiles: [obs]
    networks: [oe]
    environment:
      GF_SECURITY_ADMIN_USER: ${OE_GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${OE_GRAFANA_ADMIN_PASSWORD:-change-me-grafana}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ../../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../observability/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "${OE_GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256m
