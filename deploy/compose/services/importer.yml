services:
  importer:
    image: open-emarsys-importer:dev
    build:
      context: ../../..
      dockerfile: services/importer/Dockerfile
    profiles: [core]
    networks: [oe]
    ports:
      - "${OE_IMPORTER_PORT:-3003}:8080"
    environment:
      IMPORTER_DATABASE_URL: postgres://importer:${OE_PG_IMPORTER_PASSWORD}@${OE_PG_HOST:-postgres}:${OE_PG_HOST_PORT:-5432}/${OE_PG_DB}?pool_max_conns=${OE_PG_POOL:-5}
      IMPORTER_CORE_URL: http://core:3000
      # Entry "importer" in core's CORE_SERVICE_CREDENTIALS file.
      IMPORTER_SERVICE_SECRET: ${IMPORTER_SERVICE_SECRET:?set IMPORTER_SERVICE_SECRET in .env}
      IMPORTER_MINIO_ENDPOINT: minio:9000
      IMPORTER_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      IMPORTER_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      # Host that browsers use to reach MinIO; presigned URLs are signed for it.
      IMPORTER_MINIO_PUBLIC_ENDPOINT: localhost:${MINIO_API_PORT:-9000}
      IMPORTER_WORKERS: ${IMPORTER_WORKERS:-2}
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      minio-init:
        condition: service_completed_successfully
      core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256m
